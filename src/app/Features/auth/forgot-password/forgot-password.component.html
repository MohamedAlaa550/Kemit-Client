<section class="form-shell">
  <p class="eyebrow">{{ 'secureRecovery' | t }}</p><h1>{{ 'forgotTitle' | t }}</h1>
  @if(sent()){<div style="padding:1rem;border:1px solid #3e8157;border-radius:1rem;background:#102218"><b>{{ 'checkEmail' | t }}</b><p class="muted">{{ 'recoverySent' | t }}</p></div>}
  @else{<p class="muted">{{ 'recoveryLead' | t }}</p>}
  <form [formGroup]="form" (ngSubmit)="submit()"><div class="form-group"><label for="forgot-email">{{ 'email' | t }}</label><input class="form-control" id="forgot-email" type="email" formControlName="email" autocomplete="email">@if(form.controls.email.touched&&form.controls.email.invalid){<p class="field-error">{{ 'emailInvalid' | t }}</p>}</div>
    <button class="btn btn-gold form-submit" type="submit" [disabled]="form.invalid||submitting()||retry()>0">@if(retry()){ {{ 'resendAfter' | t }} {{retry()}} {{ 'second' | t }} }@else if(submitting()){ {{ 'sending' | t }} }@else{ {{ 'sendRecovery' | t }} }</button>
  </form><p class="form-footer"><a routerLink="/auth/login">{{ 'backToLogin' | t }}</a></p>
</section>
